<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e3d3c6">
  <title>Où est le chat ? · test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <div id="phone" aria-label="Portrait phone frame">
      <div id="stage">
        <canvas id="scene" aria-label="Salon"></canvas>
        <canvas id="bubbles" aria-hidden="true"></canvas>
        <div id="fadeveil" hidden></div>
        <div id="overlay" role="button" tabindex="0" aria-label="Touchez pour commencer">
          <p>Touchez pour commencer</p>
        </div>
        <div id="wordcard" hidden>
          <h2 class="wc-title">Mots</h2>
          <div id="vocab-list" class="vocab-list"></div>
          <button type="button" id="replay">Replay</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="scene.js"></script>
</body>
</html>
