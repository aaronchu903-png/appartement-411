<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a22">
  <title>Où est le chat ? · test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <div id="phone" aria-label="Portrait phone frame">
      <div id="stage">
        <canvas id="scene" width="96" height="64" aria-label="Salon"></canvas>
        <div id="overlay" role="button" tabindex="0" aria-label="Tap to start">
          <p>Tap to start</p>
        </div>
        <div id="wordcard" hidden>
          <div class="words">le chat · le canapé · derrière</div>
          <div class="contrast">devant</div>
          <button type="button" id="replay">Replay</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="scene.js"></script>
</body>
</html>
